# Public (browser-facing) service addresses for the dev server proxy mode.
#
# Overlay on top of conf/chipster.yaml, selected with:
#
#     ./gradlew run -Pproxy
#
# The browser reaches every service through the Angular dev server, which
# proxies them and strips the path prefix (see chipster-web/proxy.conf.json),
# so that only the dev server port has to be forwarded from a remote dev
# environment, instead of one port per service. Serve the app with
# "npm run start:proxy" to match.
#
# This is how the deployments work too: there the ingress does the proxying and
# the prefix stripping, and these addresses are generated by the Helm chart
# (chipster-openshift/k3s/helm/chipster/templates/service-locator-secret.yaml).
#
# The services still listen on their own ports (url-bind-* and
# url-admin-bind-*) and talk to each other directly (url-int-*).
#
# The addresses have to be written out in full, because {{variable}} references
# are only expanded in chipster-defaults.yaml, not in the values of these files.

# url-ext-web-server is the same in both modes, but it is set here too, so that
# this file alone configures proxy mode. Otherwise a conf/chipster.yaml without
# it (it's not in git) would leave the OIDC callback and the CORS origin
# pointing to the default port.
url-ext-web-server: http://localhost:4200
url-ext-auth: http://localhost:4200/auth
url-ext-service-locator: http://localhost:4200/service-locator
url-ext-session-db: http://localhost:4200/session-db
url-ext-session-db-events: ws://localhost:4200/session-db-events
url-ext-scheduler: http://localhost:4200/scheduler
url-ext-file-broker: http://localhost:4200/file-broker
url-ext-toolbox: http://localhost:4200/toolbox
url-ext-session-worker: http://localhost:4200/session-worker
url-ext-type-service: http://localhost:4200/type-service

# Admin APIs, proxied the same way under a "<service>-admin" prefix, as in the
# deployment. The admin view requests these for every service that
# service-locator gives an adminUri for. file-storage has no admin address
# here, in the deployment either.

url-admin-ext-web-server: http://localhost:4200/web-server-admin
url-admin-ext-auth: http://localhost:4200/auth-admin
url-admin-ext-service-locator: http://localhost:4200/service-locator-admin
url-admin-ext-session-db: http://localhost:4200/session-db-admin
url-admin-ext-scheduler: http://localhost:4200/scheduler-admin
url-admin-ext-file-broker: http://localhost:4200/file-broker-admin
url-admin-ext-toolbox: http://localhost:4200/toolbox-admin
url-admin-ext-session-worker: http://localhost:4200/session-worker-admin
url-admin-ext-type-service: http://localhost:4200/type-service-admin
url-admin-ext-job-history: http://localhost:4200/job-history-admin
url-admin-ext-backup: http://localhost:4200/backup-admin
url-admin-ext-s3-storage: http://localhost:4200/s3-storage-admin
