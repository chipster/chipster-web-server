# Public (browser-facing) service addresses for the dev server proxy mode.
#
# Overlay on top of conf/chipster.yaml, selected with:
#
#     ./gradlew runProxy
#
# The browser reaches every service through the Angular dev server, which
# proxies them and strips the path prefix (see chipster-web/proxy.conf.json),
# so that only the dev server port has to be forwarded from a remote dev
# environment, instead of one port per service. Serve the app with
# "npm run start:proxy" to match.
#
# This is how the deployments work too: there the ingress does the proxying and
# the prefix stripping, and these addresses are generated by the Helm chart
# (chipster-openshift/k3s/helm/chipster/templates/service-locator-secret.yaml).
#
# The addresses here are relative, so that they don't have to name the port
# where the browser reaches the dev server. Then this file needs no editing
# whatever the port forwarding of a remote dev environment happens to be, and
# two dev environments can run side by side without one sending its requests
# to the other. The browser resolves the addresses against the address of the
# app, the websocket one included: the WebSocket constructor parses a relative
# address too and changes the scheme from http to ws.
#
# Three things need absolute addresses and don't work in this mode:
#
# - OIDC login. Auth builds the redirect_uri of the identity provider from
#   url-ext-auth, see OidcResource.getCallbackPath(). Logging in with a
#   username and a password is not affected.
# - CORS. url-ext-web-server is compared to the Origin header of the browser,
#   see CORSFilter, so the services add no CORS headers. Nothing misses them
#   here: the browser gets both the app and the APIs from the dev server, i.e.
#   from one origin, and the dev server adds "Access-Control-Allow-Origin: *"
#   to the responses it proxies anyway (the default of Vite).
# - Java clients that use the public addresses: the integration tests
#   (TestServerLauncher.getTargetUri()), ChipsterJavaClient and anything with
#   "use-external-addresses: true". Run "./gradlew test" against a backend
#   started with a plain "./gradlew run", like before.
#
# The services still listen on their own ports (url-bind-* and
# url-admin-bind-*) and talk to each other directly (url-int-*).

# The app itself, i.e. the root of the dev server. Set here too, so that this
# file alone configures proxy mode: a conf/chipster.yaml without it (it's not
# in git) would leave this pointing to the default port.
url-ext-web-server: /
url-ext-auth: /auth
url-ext-service-locator: /service-locator
url-ext-session-db: /session-db
url-ext-session-db-events: /session-db-events
url-ext-scheduler: /scheduler
url-ext-file-broker: /file-broker
url-ext-toolbox: /toolbox
url-ext-session-worker: /session-worker
url-ext-type-service: /type-service

# Admin APIs, proxied the same way under a "<service>-admin" prefix, as in the
# deployment. The admin view requests these for every service that
# service-locator gives an adminUri for. file-storage has no admin address
# here, in the deployment either.

url-admin-ext-web-server: /web-server-admin
url-admin-ext-auth: /auth-admin
url-admin-ext-service-locator: /service-locator-admin
url-admin-ext-session-db: /session-db-admin
url-admin-ext-scheduler: /scheduler-admin
url-admin-ext-file-broker: /file-broker-admin
url-admin-ext-toolbox: /toolbox-admin
url-admin-ext-session-worker: /session-worker-admin
url-admin-ext-type-service: /type-service-admin
url-admin-ext-job-history: /job-history-admin
url-admin-ext-backup: /backup-admin
url-admin-ext-s3-storage: /s3-storage-admin
